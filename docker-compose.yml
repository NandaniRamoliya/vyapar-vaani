# Start everything with:  docker compose up --build
# Then open http://localhost:3000  (no .env or API keys required)
services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - vaani-data:/data   # khata, orders and voice signatures survive restarts
    restart: unless-stopped

volumes:
  vaani-data:
