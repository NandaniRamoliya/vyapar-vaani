# Start everything with:  docker compose up --build
# Then open http://localhost:3000  (no .env or API keys required)
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Optional overrides; the app starts fine without any of these (see .env.example)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@123}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - vaani-data:/data   # every shop's database + accounts survive restarts
    restart: unless-stopped

volumes:
  vaani-data:
